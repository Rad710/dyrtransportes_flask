# D y R Transportes — public demo. Pull-only (images from GHCR), behind its own
# Cloudflare Tunnel, using the shared MySQL (platform stack). No host ports, no own DB.
#
#   docker compose --env-file .env -f docker-compose.yml up -d
#   docker compose --env-file .env -f docker-compose.yml run --rm seed   # once, to load demo data
name: dyr-demo

services:
  # nginx serves the SPA and proxies /api/ → the api container (baked nginx.conf
  # references the host `dyrtransportes-flask`, so the api service keeps that name).
  web:
    image: ghcr.io/rad710/dyrtransportes-react:${IMAGE_TAG:-latest}
    environment:
      VITE_API_URL: "" # same-origin; nginx proxies /api/ to the api
    # Override the baked nginx.conf (which proxies /adminer/ to a host not in this stack).
    volumes:
      - ./nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      dyrtransportes-flask:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  dyrtransportes-flask:
    image: ghcr.io/rad710/dyrtransportes-flask:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: mysql-shared # the shared platform MySQL
      DB_PORT: "3306"
      DB_NAME: dyr_demo
      DB_USERNAME: dyr
      DB_PASSWORD: ${DYR_DB_PASSWORD:?set DYR_DB_PASSWORD in .env (matches platform)}
      API_KEY: ${JWT_SECRET:?set JWT_SECRET in .env (used to sign JWTs)}
      DEBUG: "0"
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/hello-world')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s # first boot creates the schema + triggers
    restart: unless-stopped
    networks:
      - internal
      - shared-db

  # Cloudflare Tunnel → routes dyr.rad710.com to web:80. No inbound host ports.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN in .env}
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  # One-shot: load a synthetic demo dataset via the API. Run with:
  #   docker compose --env-file .env -f docker-compose.yml run --rm seed
  # Idempotent — safe to re-run; skips if the demo account already exists.
  seed:
    image: python:3.12-slim
    profiles: ["seed"] # not started by `up`; only via `run`
    depends_on:
      dyrtransportes-flask:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      # Go through nginx (same path the browser uses) — more stable than hitting
      # uWSGI's bare --http listener directly.
      API_BASE: http://web
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@rad710.com}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
    volumes:
      - ./seed:/seed:ro
    command: ["sh", "-c", "pip install --quiet requests && python /seed/seed.py"]
    restart: "no"
    networks:
      - internal

networks:
  internal:
  shared-db:
    external: true
