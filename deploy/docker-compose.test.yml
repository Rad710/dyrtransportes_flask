# MySQL used by the test suite:
#   docker compose -f deploy/docker-compose.test.yml up -d
#   pytest
# The data lives in the container only, it is thrown away with it.

services:
  dyrtransportes-mysql-test:
    image: mysql:9.2.0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dyrtransportes_test

    container_name: dyrtransportes-mysql-test

    ports:
      - 3306:3306

    healthcheck:
      test:
        ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -proot --silent']
      interval: 5s
      timeout: 5s
      retries: 10
