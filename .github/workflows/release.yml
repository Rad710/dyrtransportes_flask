# Build the API image and push it to GHCR. The VM pulls — it never builds.
# The test suite runs first, the image is only published when it passes.
# Trigger: push a version tag (git tag v1.0.0 && git push --tags) or run from the Actions tab.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rad710/dyrtransportes-flask # owner must be lowercase for GHCR

jobs:
  # Same suite as the tests workflow, reused instead of duplicated
  tests:
    uses: ./.github/workflows/tests.yml

  build-push:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
