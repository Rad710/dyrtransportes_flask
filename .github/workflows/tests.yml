# Run the test suite on every push and pull request.
# MySQL comes as a service container and LibreOffice is installed so the PDF
# exports are converted for real, the same way the production image does it.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.2.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dyrtransportes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: dyrtransportes_test
      API_KEY: test-secret-key-that-is-long-enough-for-hs256

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      # mysqlclient is built from source, LibreOffice converts the exports
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            default-libmysqlclient-dev \
            libreoffice-calc-nogui \
            fonts-liberation

      - name: Install Python dependencies
        run: |
          pip install -r requirements-common.txt
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: pytest --cov=src --cov-report=term
